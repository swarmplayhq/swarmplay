[package]
name = "azrak"
version = "1.32.7"
edition = "2021"
description = "SwarmPlay: a fast, native console-style game launcher for Linux (a fork of Azrak Launcher)"
license = "MIT"
repository = "https://github.com/swarmplayhq/swarmplay"
homepage = "https://swarmplayhq.github.io"
rust-version = "1.92"
# The program is SwarmPlay; the package keeps upstream's name so merges from Azrak Launcher stay easy.
autobins = false

[[bin]]
name = "swarmplay"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No "gzip": it makes every request say Accept-Encoding, and fastpic.org (where most forum covers
# are) answers 404 to any request that does. Catalogs are downloaded as .gz files and unpacked.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "5"
qoi = "0.4"
sha1_smol = "1"
libc = "0.2"
libloading = "0.8"
flate2 = "1"
html-escape = "0.2"
percent-encoding = "2"
sha2 = "0.10"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
unrar_sys = "0.5.8"
url = "2"
data-encoding = "2"
tr = { version = "0.1.11", default-features = false, features = ["mo-translator"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.18"
# The translations (i18n/*.po) compiled to .mo for Rust's tr! (see build.rs).
rspolib = "0.1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# Decoding images in debug builds is painfully slow; optimize dependencies even there.
[profile.dev.package."*"]
opt-level = 2

# For working on the launcher (scripts/check.sh): our code unoptimised and incremental (the
# Slint UI's generated code is most of it: optimising it took ~3 min an edit), the libraries
# fully optimised and built once (image decoding, rendering), shared with the tests.
[profile.quick]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 64
incremental = true
strip = false

[profile.quick.package."*"]
opt-level = 3
codegen-units = 16
